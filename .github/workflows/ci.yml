name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-bank     # 백엔드 프로젝트 폴더
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정(캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드와 테스트
        run: ./gradlew build        # Testcontainers가 GitHub Actions의 Docker로 MySQL을 띄운다
