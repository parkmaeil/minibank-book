plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'                                    // 10.7절 테스트 커버리지
}

group = 'com.itscoding'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 9.1절 사용할 Vaadin 버전을 한 곳에서 정한다
ext {
	set('vaadinVersion', "25.3.4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // 5.1절 JPA
	implementation 'org.springframework.boot:spring-boot-starter-flyway'       // 5.8절 Flyway
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'com.vaadin:vaadin-spring-boot-starter'                    // 9.1절 Vaadin
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'   // 버전은 Spring Boot가 관리
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'com.vaadin:vaadin-dev'     // 개발 모드 전용 도구 — 배포용 Jar에는 포함되지 않는다
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'   // 10.5절 @DataJpaTest
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'          // 10.6절 Testcontainers
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 9.1절 Vaadin 라이브러리들의 버전을 BOM으로 일괄 관리한다
dependencyManagement {
	imports {
		mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
	}
}

// 10.7절 JaCoCo 보고서 (build/reports/jacoco/test/html/index.html)
jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport          // 테스트가 끝나면 보고서를 자동 생성
}
