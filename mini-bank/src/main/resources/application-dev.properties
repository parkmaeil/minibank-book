logging.level.root=INFO
logging.level.com.itscoding=DEBUG

# 3.3절 API 문서(Swagger UI)는 개발 환경에서만 켠다
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 19.3절 개발용 기본 JWT 키 (JWT_SECRET 환경 변수가 있으면 그 값을 쓴다). 운영에서는 절대 쓰지 말 것
minibank.jwt.secret=${JWT_SECRET:dev-only-secret-key-minibank-0123456789}

# 5.1절 개발할 때만 — 엔티티를 분석해 테이블을 자동 생성/수정하고, 실제 SQL을 콘솔에 출력한다
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5.8절 개발 중에는 ddl-auto=update가 스키마를 맞추므로 Flyway는 끈다
spring.flyway.enabled=false
