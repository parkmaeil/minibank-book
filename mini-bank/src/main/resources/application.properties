spring.application.name=mini-bank
spring.profiles.active=dev

# 3.7절 @ConfigurationProperties
minibank.account.number-prefix=110
minibank.account.default-daily-limit=3000000

# 5.1절 MySQL 연결 — 11.7절에서 비밀번호를 환경 변수로 뺐다
# (IntelliJ 실행 시 Run Configuration의 Environment variables에 DB_PASSWORD=minibank1234! 지정)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minibank}
spring.datasource.username=${DB_USERNAME:minibank}
spring.datasource.password=${DB_PASSWORD}

# 5.6절 요청이 끝날 때까지 DB 연결을 붙잡지 않는다 (Service 안에서 DTO로 바꿔 내보내므로 필요 없다)
spring.jpa.open-in-view=false

# 8.7절 Page<T>를 JSON으로 내보낼 때 content·totalPages·number가 최상위에 오도록 한다
# (React 화면의 Page<T> 타입이 이 모양을 기대한다 — 18.3절)
spring.data.web.pageable.serialization-mode=direct
