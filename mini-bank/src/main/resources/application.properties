spring.application.name=mini-bank
spring.profiles.active=dev

# 3.7절 @ConfigurationProperties
minibank.account.number-prefix=110
minibank.account.default-daily-limit=3000000

# 5.1절 MySQL 연결
spring.datasource.url=jdbc:mysql://localhost:3306/minibank
spring.datasource.username=minibank
spring.datasource.password=minibank1234!

# 5.6절 요청이 끝날 때까지 DB 연결을 붙잡지 않는다 (Service 안에서 DTO로 바꿔 내보내므로 필요 없다)
spring.jpa.open-in-view=false

# 8.7절 Page<T>를 {"content": [...], "page": {size, number, totalElements, totalPages}} 모양으로 내보낸다
# (Spring Data 권장 방식 — 구조가 고정되어 React 화면(19장)이 믿고 쓸 수 있다)
spring.data.web.pageable.serialization-mode=via_dto
