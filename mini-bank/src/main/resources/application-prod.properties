logging.level.root=WARN
logging.level.com.itscoding=INFO

# 3.3절 운영 환경에서는 API 문서를 끈다
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 3.8절 로그를 파일로 남기기
logging.file.name=logs/mini-bank.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# 5.8절 스키마 변경은 Flyway가 맡고, Hibernate는 엔티티와 테이블이 맞는지 검증만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
